<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>王某某的独行日志</title>
    <link rel="icon" type="image/x-icon" href="https://i.loli.net/2021/06/03/lFg2V4WUcmkB98G.png">
    <meta name="language" content="zh-CN">
    <meta name="title" content="王小达">
    <meta name="github" content="https://github.com/fhpeerless">
    <meta name="describe" content="爱情面前是是一张白纸! ">
    <!-- 静态资源版本号：改过 css/js 后，把下面所有 ?v=20260914i 统一改成新值（建议当天日期+序号，如 20260915、20260915b），
         浏览器就会重新下载，不再吃缓存。页面右下角会显示当前生效的版本号，可用来确认有没有吃到旧缓存。 -->
    <link type="text/css" rel="stylesheet" href="./css/default.css?v=20260914i">
    <link type="text/css" rel="stylesheet" href="./css/music-player.css?v=20260914i">
    <link type="text/css" rel="stylesheet" href="./css/stars-bg.css?v=20260914i">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script type="text/javascript" src="./js/jquery.min.js?v=20260914i"></script>
    <script type="text/javascript" src="./js/jscex.min.js?v=20260914i"></script>
    <script type="text/javascript" src="./js/jscex-parser.js?v=20260914i"></script>
    <script type="text/javascript" src="./js/jscex-jit.js?v=20260914i"></script>
    <script type="text/javascript" src="./js/jscex-builderbase.min.js?v=20260914i"></script>
    <script type="text/javascript" src="./js/jscex-async.min.js?v=20260914i"></script>
    <script type="text/javascript" src="./js/jscex-async-powerpack.min.js?v=20260914i"></script>
    <script type="text/javascript" src="./js/functions.js?v=20260914i" charset="utf-8"></script>
    <script type="text/javascript" src="./js/love.js?v=20260914i" charset="utf-8"></script>

</head>

<body>
    <canvas id="stars-bg"></canvas>
    <div id="navbar">
        <button id="animation-btn" class="nav-btn active">爱心树</button>
        <button id="diary-btn" class="nav-btn">日记</button>
        <button id="fund-btn" class="nav-btn">💰 爱心储罐</button>
        <button id="music-btn" class="nav-btn music-btn">🎵 播放音乐</button>
    </div>
    <div id="diary-section">
        <div id="diary-content">

            <p class="diary-intro">只想许一人偏爱，朝朝暮暮！</p>
            <p class="diary-intro">邮箱:68208932@qq.com</p>
            <div id="diary-entries"></div>
        </div>
    </div>
    <div id="fund-section">
        <div id="fund-content">
            <h2>💰 爱心储罐</h2>
            <p style="text-align:center;color:#aaa;font-size:14px;margin-top:-8px;margin-bottom:16px;">金币为rmb7倍计算</p>
            <div class="fund-status-cards">
                <div class="fund-card">
                    <div class="fund-card-label">总权益</div>
                    <div class="fund-card-value" id="fund-total-equity">--</div>
                    <div class="fund-card-unit">金币</div>
                </div>
                <div class="fund-card">
                    <div class="fund-card-label">可用余额</div>
                    <div class="fund-card-value" id="fund-available-balance">--</div>
                    <div class="fund-card-unit">金币</div>
                </div>
                <div class="fund-card">
                    <div class="fund-card-label">投资数</div>
                    <div class="fund-card-value" id="fund-open-count">--</div>
                    <div class="fund-card-unit">笔</div>
                </div>
                <div class="fund-card">
                    <div class="fund-card-label">未实现盈亏</div>
                    <div class="fund-card-value" id="fund-unrealized-pnl">--</div>
                    <div class="fund-card-unit">金币</div>
                </div>
                <div class="fund-card">
                    <div class="fund-card-label">总盈亏</div>
                    <div class="fund-card-value" id="fund-pnl-ratio">--</div>
                    <div class="fund-card-unit">%</div>
                </div>
            </div>
            <div class="fund-position-badge" id="fund-position-badge">
                <span class="fund-badge-label">趋势状态</span>
                <span class="fund-badge-value" id="fund-position-text">查询中...</span>
            </div>
            <div class="fund-chart-container">
                <canvas id="fund-chart"></canvas>
            </div>
            <div class="fund-footer">
                <button id="fund-refresh-btn" class="fund-btn">🔄 刷新数据</button>
                <span class="fund-update-time" id="fund-update-time"></span>
                <span class="fund-update-time" id="fund-version"></span>
            </div>
        </div>
    </div>
    <div id="music-section">
        <div class="music-header">
            <h2>🎵 音乐播放器</h2>
        </div>

        <div class="music-layout">
            <div class="music-list-section hidden">
                <div class="music-list-title">播放列表</div>
                <ul class="music-list">
                </ul>
            </div>
            
            <div class="music-player-container">
                <div class="current-song-info">
                    <div class="song-cover">
                        <span class="song-cover-icon">🎵</span>
                    </div>
                    <div class="song-title-display">正在加载...</div>
                </div>

                <div class="lyrics-wrap">
                    <div class="lyrics-notes" aria-hidden="true">
                        <span style="left:5%;font-size:18px;animation-duration:9s;animation-delay:0s">♪</span>
                        <span style="left:14%;font-size:26px;animation-duration:12s;animation-delay:1.5s">♫</span>
                        <span style="left:23%;font-size:16px;animation-duration:10s;animation-delay:3s">♩</span>
                        <span style="left:32%;font-size:22px;animation-duration:13s;animation-delay:0.8s">♬</span>
                        <span style="left:41%;font-size:20px;animation-duration:11s;animation-delay:4.2s">♪</span>
                        <span style="left:50%;font-size:28px;animation-duration:14s;animation-delay:2.4s">♫</span>
                        <span style="left:59%;font-size:17px;animation-duration:9.5s;animation-delay:5.5s">♩</span>
                        <span style="left:68%;font-size:24px;animation-duration:12.5s;animation-delay:3.8s">♬</span>
                        <span style="left:77%;font-size:19px;animation-duration:10.5s;animation-delay:6.5s">♪</span>
                        <span style="left:86%;font-size:25px;animation-duration:13.5s;animation-delay:1.1s">♫</span>
                        <span style="left:93%;font-size:16px;animation-duration:11.5s;animation-delay:7.2s">♩</span>
                    </div>
                    <div class="lyrics-display">
                        <div class="lyrics-line">选择歌曲开始播放</div>
                    </div>
                </div>

                <div class="volume-control">
                    <span class="volume-icon">🔊</span>
                    <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="0.5">
                </div>

                <div class="progress-section">
                    <div class="time-display">
                        <span class="current-time">00:00</span>
                        <span class="duration-time">00:00</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill"></div>
                    </div>
                </div>

                <div class="player-controls">
                    <button id="togglePlaylistBtn" class="toggle-playlist-btn">显示播放列表</button>
                    <button id="prevBtn" class="control-btn">⏮</button>
                    <button id="playPauseBtn" class="control-btn play-btn">▶</button>
                    <button id="nextBtn" class="control-btn">⏭</button>
                    <button id="desktopLyricsBtn" class="toggle-playlist-btn" title="桌面歌词">🖥️ 桌面歌词</button>
                </div>
            </div>
        </div>
    </div>
    <div id="main">
        <div id="error">亲，您使用的浏览器无法支持即将显示的内容，请换成谷歌(<a
                href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a>)或者火狐(<a
                href="http://firefox.com.cn/download/">Firefox</a>)浏览器哟~</div>
        <h1 id="main-title"></h1>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <div id="slideshow">
                        <img id="current-photo" src="" style="max-width: 100%; max-height: 100%; display: none;">
                    </div>
                </div>
            </div>
            <div id="clock-box">
                <a href="https://xtwa.org" target="_blank">老己</a> 想 <a href="https://xtwa.org"
                    target="_blank">老己</a>脱单的
                <div id="clock"></div>
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
        </div>

    </div>

    <div id="tree-status-bar">

        <div id="progress-bar-container">
            <div id="progress-bar-track">
                <div id="progress-bar-fill"></div>
                <div id="progress-bar-thumb"></div>
                <div id="progress-bar-state"></div>
                <div class="progress-marker" style="left: 16.7%;" title="3月2日 苏醒"><span>苏醒</span></div>
                <div class="progress-marker" style="left: 19.2%;" title="3月10日 发芽"><span>发芽</span></div>
                <div class="progress-marker" style="left: 21.6%;" title="3月20日 开始结果"><span>结果</span></div>
                <div class="progress-marker" style="left: 62.2%;" title="8月15日 结果完毕"><span>完毕</span></div>
                <div class="progress-marker" style="left: 67.1%;" title="9月2日 开始成熟"><span>成熟</span></div>
                <div class="progress-marker" style="left: 76.4%;" title="10月6日 熟透"><span>熟透</span></div>
                <div class="progress-marker" style="left: 83.6%;" title="11月1日 开始掉落"><span>掉落</span></div>
                <div class="progress-marker" style="left: 98.4%;" title="12月25日 休眠"><span>休眠</span></div>
            </div>
        </div>
    </div>

    <div id="butterfly-container"></div>

    <div id="desktop-lyrics">
        <div id="desktop-lyrics-line"></div>
    </div>

    
    <script type="text/javascript" src="./js/music-player.js?v=20260914i" charset="utf-8"></script>
    <script type="text/javascript" src="./js/main.js?v=20260914m" charset="utf-8"></script>
    <script type="text/javascript" src="./js/stars-bg.js?v=20260914i" charset="utf-8"></script>
    <script type="text/javascript" src="./js/butterfly.js?v=20260914i" charset="utf-8"></script>
    

</body>

</html>
